<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Hola Mundo — Taller Ocampo</title>
</head>
<body>
  <h1>Hola, mundo</h1>
  <p id="mensaje">Mi primera página publicada. Noche 1 de Taller Ocampo.</p>
  <button id="boton">Haz clic aquí</button>

  <script>
    const boton = document.getElementById("boton");
    const mensaje = document.getElementById("mensaje");

    boton.addEventListener("click", function () {
      mensaje.textContent = "¡Esto ya es JavaScript funcionando! Noche 2 de Taller Ocampo.";
      mensaje.style.color = "green";
    });
  </script>
</body>
</html>
